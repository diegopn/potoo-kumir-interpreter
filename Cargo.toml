[package]
name = "potoo-kumir-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-kumir-interpreter"
homepage = "https://diegopn.github.io/potoo-site/manual/kumir/"
readme = "README.md"
description = "A host-driven interpreter for a documented subset of the Kumir 2 school algorithmic language."

[lib]
name = "potoo_kumir_interpreter"
path = "src/lib.rs"

[[bin]]
name = "potoo-kumir"
path = "src/bin/potoo-kumir.rs"
